framework:
    messenger:
        # Three global buses, no bus per module (see src/SharedKernel/GLOSSARY.md).
        default_bus: command.bus
        buses:
            # One command = one transaction: flush and commit, or rollback on exception. A command never
            # dispatches another one inside its transaction; it goes through the outbox.
            command.bus:
                middleware:
                    - doctrine_transaction
            query.bus: ~
            # Domain events are published explicitly by the command handler, synchronously, in the
            # transaction. An event nobody listens to is not an error.
            event.bus:
                default_middleware:
                    enabled: true
                    allow_no_handlers: true
